name: build-publish-deploy
on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io/anrisyu

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login al registro
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push backend
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ env.REGISTRY }}/backend:${{ github.sha }}

      - name: Build y push consumer
        uses: docker/build-push-action@v6
        with:
          context: ./consumer
          push: true
          tags: ${{ env.REGISTRY }}/consumer:${{ github.sha }}

      - name: Desplegar
        run: echo "Aquí va el comando de despliegue del proveedor elegido"
